# Build a WebAssembly library (cdylib) and a library for native tests (rlib).
# Pin wasm-bindgen to keep generated JS glue compatible.

[package]
name = "market-producer"
version = "0.1.0"
edition = "2021"
publish = false
description = "Deterministic fictional market generator for the FinDev terminal"
repository = "https://github.com/andreyp757/findev-test"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.100"

# Optimize release size to reduce the browser download.
[profile.release]
lto = true
opt-level = "s"
codegen-units = 1

[package.metadata.wasm-pack.profile.release]
# Disable wasm-opt to avoid an additional build dependency.
wasm-opt = false
