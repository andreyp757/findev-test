# Назначение файла: Пакет Rust: библиотека для WebAssembly (cdylib) и native-тестов (rlib).
# Версия wasm-bindgen фиксирована для согласованной генерации JS-обёртки.

[package]
name = "market-producer"
version = "0.1.0"
edition = "2021"
publish = false
description = "Deterministic fictional market generator for the FinDev terminal"
repository = "https://github.com/andreyp757/findev-test"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.100"

# Релиз оптимизируется на размер: для браузера важен и объём загружаемого бинарника.
[profile.release]
lto = true
opt-level = "s"
codegen-units = 1

[package.metadata.wasm-pack.profile.release]
# Дополнительный wasm-opt отключён: сборке не требуется ещё один оптимизатор.
wasm-opt = false
