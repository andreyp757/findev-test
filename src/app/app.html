<!-- Назначение: разметка оболочки приложения; логика находится в соседнем TypeScript-файле. -->
<a class="skip-link" href="#main" (click)="skipToMain($event)"
  >Skip to content</a
>
<header class="app-header">
  <a class="brand" routerLink="/" aria-label="FinDev home"
    ><span class="brand-mark">f<span>↗</span></span
    >fin<span class="brand-light">dev</span
    ><span class="brand-tag">TERMINAL</span></a
  >
  <nav aria-label="Main navigation">
    <a
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      ><span aria-hidden="true">▦</span> Dashboard</a
    >
    <a routerLink="/settings" routerLinkActive="active"
      ><span aria-hidden="true">⚙</span> Settings</a
    >
  </nav>
  <div class="header-meta">
    <span
      class="connection-dot"
      [class.live]="engine.status() === 'Running'"
    ></span
    >Simulation environment<span class="avatar">AP</span>
  </div>
</header>
<main id="main" tabindex="-1"><router-outlet /></main>
<footer class="app-footer">
  <span
    ><span class="tiny-dot"></span> Fictional instruments. Real-time
    computation.</span
  ><span>ANGULAR <i>/</i> RUST <i>/</i> WEBASSEMBLY</span>
</footer>
